<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header class="topo">
            <h1>🛍️ Minha loja</h1>
            <div class="usuario">
                <span id="nome-usuario"></span>
                <button type="button" id="botao-sair" class="apagar">Sair</button>
            </div>
        </header>

        <form id="formulario">
            <h2 id="titulo-form">Cadastrar produto</h2>
            <input type="text" id="nome" placeholder="Nome do produto">
            <input type="number" id="preco" placeholder="Preço" step="0.01">
            <div class="botoes">
                <button type="submit" id="botao-salvar">Cadastrar</button>
                <button type="button" id="botao-cancelar" hidden>Cancelar</button>
            </div>
            <p id="mensagem" role="alert"></p>
        </form>

        <h2>Produtos</h2>
        <ul id="lista"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loja</title>
</head>
<body>
    <main>
        <h1>🛍️Minha loja</h1>

        <form id="formulario">
            <h2 id="titulo-form">Cadastrar produto</h2>
            <input type="text" id="nome" placeholder="Nome do produto">
            <input type="number" id="preco" placeholder="Preço" step="0.01">
            <div class="botoes">
                <button type="submit" id="botao-salvar">cadastrar</button>
                <button type="button" id="botao-cancelar" hidden>cancelar</button>
            </div>
        </form>

        <h2>produtos</h2>
        <ul id="lista"></ul>
    </main>
    
    <script src="script.js"></script>
</body>
</html>

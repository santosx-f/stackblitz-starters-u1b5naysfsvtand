<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Minha loja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
    <main class="cartao">
        <h1>🛍️ Minha loja</h1>

        <form id="form-login">
            <h2 id="titulo-login">Entrar</h2>

            <input type="text" id="nome" placeholder="Seu nome" autocomplete="name" hidden>
            <input type="email" id="email" placeholder="E-mail" autocomplete="email" required>
            <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>

            <p id="mensagem" role="alert"></p>

            <button type="submit" id="botao-enviar">Entrar</button>
            <button type="button" id="botao-alternar" class="link">Não tem conta? Cadastre-se</button>
        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
